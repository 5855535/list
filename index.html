<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- === PWA Configuración === -->
     <link rel="icon" type="image/png" href="img/icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5d574f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Lista de Compras">
    
    <!-- Logo -->
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="apple-touch-icon" href="logo.png">
</head>
<body>
    <div class="main-frame">
        <!-- Logo -->
        <div style="text-align: center; margin: 10px 0 15px 0;">
            <img src="logo.png" alt="Logo" style="max-width: 110px; height: auto; border-radius: 50%; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
        </div>

        <div class="deco broccoli">🥦</div>
        <div class="deco cheese">🧀</div>
        <div class="deco apple">🍎</div>
        <div class="deco bread">🥖</div>
        <div class="deco banana">🍌</div>
        <div class="deco tomato">🍅</div>

        <h1>Lista de compras</h1>
        
        <div class="input-section">
            <input type="text" id="itemInput" placeholder="Añadir artículo...">
            <button id="addButton">+</button>
        </div>

        <ul id="shoppingList"></ul>
    </div>

    <script type="module" src="app.js"></script>

    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('✅ Service Worker registrado'))
                .catch(err => console.log('❌ Error SW:', err));
        }
    </script>
</body>
</html>
